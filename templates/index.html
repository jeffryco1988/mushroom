<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kabute Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e8ede6;
    --panel: #f6f8f4;
    --ink: #2b2230;
    --muted: #6b6573;
    --cap: #7a3b4e;        /* kulay ng takip ng kabute */
    --cap-soft: #ecd9de;
    --stem: #fffdf7;
    --line: #cfd8cb;
    --warn: #fff3d6;
    --warn-ink: #5c4400;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b211c; --panel: #232b25; --ink: #eceaf0; --muted: #a29fab;
      --cap: #d58aa0; --cap-soft: #3a2a31; --stem: #2c352e; --line: #38433a;
      --warn: #3a3015; --warn-ink: #f2dc9a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Source Sans 3", system-ui, sans-serif; font-size: 17px; line-height: 1.55;
    display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 760px; height: 100%; display: flex; flex-direction: column; padding: 16px; gap: 12px; }
  header { display: flex; align-items: center; gap: 12px; }
  .logo { width: 44px; height: 44px; flex: none; }
  h1 { font-family: "Bricolage Grotesque", sans-serif; font-size: 1.5rem; margin: 0; line-height: 1.1; }
  header p { margin: 0; color: var(--muted); font-size: .95rem; }
  .notice { background: var(--warn); color: var(--warn-ink); border-radius: 10px; padding: 8px 12px; font-size: .9rem; }
  #log { flex: 1; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { align-self: flex-start; background: var(--stem); border: 1px solid var(--line); border-radius: 4px 16px 16px 16px; }
  .me { align-self: flex-end; background: var(--cap); color: #fff; border-radius: 16px 4px 16px 16px; }
  .err { align-self: center; background: var(--warn); color: var(--warn-ink); border-radius: 10px; font-size: .9rem; }
  .typing { color: var(--muted); font-style: italic; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { background: var(--cap-soft); color: var(--ink); border: 0; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: .9rem; cursor: pointer; }
  .chips button:hover { filter: brightness(.95); }
  form { display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .send { background: var(--cap); color: #fff; border: 0; border-radius: 12px; padding: 0 20px; font: inherit; font-weight: 600; cursor: pointer; }
  .send:disabled { opacity: .5; cursor: wait; }
  :focus-visible { outline: 3px solid var(--cap); outline-offset: 2px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
      <path d="M4 26C4 13 13 5 24 5s20 8 20 21z" fill="var(--cap)"/>
      <circle cx="15" cy="17" r="3" fill="var(--stem)"/><circle cx="28" cy="12" r="2.4" fill="var(--stem)"/><circle cx="34" cy="21" r="2" fill="var(--stem)"/>
      <path d="M17 26h14l-2 16a3 3 0 0 1-3 3h-4a3 3 0 0 1-3-3z" fill="var(--stem)" stroke="var(--line)"/>
    </svg>
    <div>
      <h1>Kabute Assistant</h1>
      <p>Magtanong tungkol sa pagtatanim, pagluluto, at kaligtasan ng kabute.</p>
    </div>
  </header>

  <div class="notice">Huwag kumain ng ligaw na kabute dahil lang sa sagot ng chatbot. Magpasuri sa eksperto.</div>

  <div id="log" aria-live="polite">
    <div class="msg bot">Kumusta! Ako si Kabute Assistant. Ano ang gusto mong malaman tungkol sa kabute?</div>
  </div>

  <div class="chips">
    <button type="button">Paano magtanim ng kabuteng talaba?</button>
    <button type="button">Ano ang masustansya sa kabute?</button>
    <button type="button">Paano malalaman kung nakakalason ang kabute?</button>
    <button type="button">Paano mag-imbak ng sariwang kabute?</button>
  </div>

  <form id="form">
    <textarea id="input" rows="2" maxlength="1000" placeholder="Isulat ang tanong mo dito..." aria-label="Tanong"></textarea>
    <button class="send" id="send" type="submit">Ipadala</button>
  </form>
</div>

<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const history = [];

  function add(cls, text) {
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  async function ask(message) {
    add("me", message);
    const wait = add("bot typing", "Sumasagot...");
    sendBtn.disabled = true;
    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, history })
      });
      const data = await res.json();
      wait.remove();
      if (!res.ok) { add("err", data.error || "May naganap na error."); return; }
      add("bot", data.reply);
      history.push({ role: "user", text: message }, { role: "model", text: data.reply });
    } catch (e) {
      wait.remove();
      add("err", "Hindi makakonekta sa server. Subukan ulit.");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const m = input.value.trim();
    if (!m) return;
    input.value = "";
    ask(m);
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  document.querySelectorAll(".chips button").forEach(b =>
    b.addEventListener("click", () => ask(b.textContent)));
</script>
</body>
</html>
